<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="description" content="FitClub AI - Next Generation Fitness Experience" />
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <title>FitClub AI</title>
    <script>
      // Apply the saved theme before the first paint so the page never flashes dark.
      (function () {
        var theme = "light";
        try { theme = localStorage.getItem("fitclub.theme") === "dark" ? "dark" : "light"; } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        var fa = false;
        try { fa = localStorage.getItem("language") === "fa"; } catch (e) {}
        document.documentElement.lang = fa ? "fa" : "en";
        document.documentElement.dir = fa ? "rtl" : "ltr";
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-white font-sans antialiased overflow-hidden select-none">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
